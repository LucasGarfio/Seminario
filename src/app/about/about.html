<form (ngSubmit)="onSubmit()" #contactForm="ngForm">
  <div class="input-group">
    <span class="input-group-text">Nombre y Apellido</span>
    <input name="first" type="text" aria-label="First name" class="form-control" ngModel>
    <input name="last" type="text" aria-label="Last name" class="form-control" ngModel>
  </div>

  <div class="input-group mb-3">
    <input name="email" type="text" class="form-control" placeholder="Recipient’s username" aria-label="Recipient’s username" aria-describedby="basic-addon2" ngModel>
    <span class="input-group-text" id="basic-addon2">@example.com</span>
  </div>

  <button class="btn btn-primary" type="submit">Enviar</button>
</form>
